[project]
name = "edu-c2-030"
version = "0.1.0"
description = "Corporate Training Program Needs Assessment & Curriculum Outline Draft Agent — generates a DSS-aligned TNA report and phased curriculum outline from an aggregate workforce profile"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; CI
# installs it from an internal package index. Pinning it here would make
# `pip install -e .` fail because it is not resolvable from the default index.
# pyyaml is a real runtime dependency: PB-7 imports it to read config/config.yaml
# when checking hitl.enabled.
dependencies = [
    "agenticstar-agentcore[openai,marketplace]==1.0.3",
    "pyyaml==6.0.1",
]

[tool.uv]
# agenticstar-agentcore's published package-index metadata can pin a
# langchain-core version incompatible with what its own "openai" extra
# (-> langchain-openai) requires — a confirmed root cause of a
# registry-install-only failure on another template. Force the SDK-compatible
# version the agentcore release actually ships with; re-verify this pin if
# the agenticstar-agentcore version above ever changes.
override-dependencies = [
    "langchain-core==1.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The internal agenticstar-agentcore/shared packages ship no py.typed marker,
# so every framework base class (FunctionNode, BaseGraph, AgentBaseGraph,
# GraphNode, AgentState, ...) resolves to Any under `strict = true`'s
# disallow_subclassing_any — every node/graph/state class in this repo
# subclasses one of them. Scoped opt-out of that one flag only; every other
# strict check still applies to this repo's own src/.
disallow_subclassing_any = false

# ignore_missing_imports scoped to those two package roots only — this
# repo's own src/ stays fully strict for import-untyped too.
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true
